name: DNS Blocklist Updater
on:
  schedule:
    - cron: '30 6,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create Blocklist
        run: |
          # 1. Initialize file with mandatory system localhost entries
          echo "127.0.0.1 localhost" > blocklist.txt
          echo "127.0.1.1 home-desktop" >> blocklist.txt
          echo "::1 ip6-localhost ip6-loopback" >> blocklist.txt
          echo "" >> blocklist.txt
          echo "# DNS Blocklist - Auto-generated" >> blocklist.txt
          echo "# Last Updated: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')" >> blocklist.txt
          echo "# ==============================================" >> blocklist.txt
          echo "" >> blocklist.txt
          
          # 2. Process external URLs securely into a temporary file
          touch temp_domains.txt
          
          urls=(
            "https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/domains/doh-vpn-proxy-bypass.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/tif.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/ultimate.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/popupads.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/hoster.txt"
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/spam-tlds.txt"
            "https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/domains/dyndns.txt"
            "https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/domains/dns-rebind-protection.txt"
            "https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/domains/social.txt"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/analyticsparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/doubleclickparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/dnsparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/proxiesparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/shortlinksparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/fontsparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/productsparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/androidparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/fiberparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/firebaseparsed"
            "https://raw.githubusercontent.com/nickspaargaren/no-google/master/categories/generalparsed"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/native.oppo-realme.txt"
            "https://raw.githubusercontent.com/jmdugan/blocklists/master/corporations/microsoft/all"
          )
          
          for url in "${urls[@]}"; do
            echo "Fetching: $url"
            curl -sL "$url" >> temp_domains.txt
          done
          
          # 3. Clean, format, and append the domains
          cat temp_domains.txt | \
            sed 's/\r//g' | \
            grep -v -E '^#|^!|^[[:space:]]*$' | \
            sed -E 's/^(0\.0\.0\.0|127\.0\.0\.1)[[:space:]]+//' | \
            grep -v -E '(facebook\.com$|\.fb\.com$|^fb\.com$|blogspot\.com$)' | \
            awk '{print $1}' | \
            sort -u | \
            awk '{print "0.0.0.0 " $1}' >> blocklist.txt
            
          rm temp_domains.txt
          
          # 4. Append Manual Exact Domains
          echo "" >> blocklist.txt
          echo "# === MANUAL EXACT DOMAINS ===" >> blocklist.txt
          echo "0.0.0.0 storeimg.heytapimg.com" >> blocklist.txt
          echo "0.0.0.0 time-push-in.heytapmobile.com" >> blocklist.txt
          echo "0.0.0.0 httpdns-push.heytapmobile.com" >> blocklist.txt
          echo "0.0.0.0 client-uc.heytapmobi.com" >> blocklist.txt
          echo "0.0.0.0 app-measurement.com" >> blocklist.txt
          echo "0.0.0.0 alt1-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt2-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt3-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt4-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt5-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt6-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt7-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 alt8-mtalk.google.com" >> blocklist.txt
          echo "0.0.0.0 mtalk.google.com" >> blocklist.txt
          
          # 5. Add Wildcard comments (Informational only)
          echo "" >> blocklist.txt
          echo "# === WILDCARD DOMAINS (Not natively supported by /etc/hosts) ===" >> blocklist.txt
          echo "# 0.0.0.0 *.heytapimg.com" >> blocklist.txt
          echo "# 0.0.0.0 *.heytapmobile.com" >> blocklist.txt
          echo "# 0.0.0.0 *.heytapmobi.com" >> blocklist.txt
          echo "# 0.0.0.0 *.heytap.com" >> blocklist.txt
          echo "# 0.0.0.0 *.heytapdl.com" >> blocklist.txt
          echo "# 0.0.0.0 *.heytapdownload.com" >> blocklist.txt
          echo "# 0.0.0.0 *.app-measurement.com" >> blocklist.txt
          echo "# 0.0.0.0 *.mtalk.google.com" >> blocklist.txt

      - name: Commit Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add blocklist.txt
          git commit -m "Update blocklist: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')" || echo "No changes"
          git push
