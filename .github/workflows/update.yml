name: DNS Blocklist Updater
on:
  schedule:
    - cron: '30 6,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Generate Blocklist
        run: python update_blocklist.py

      - name: Commit and push blocklist to root
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add blocklist.txt
          git commit -m "Update blocklist: $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push

      - name: Delete old release assets
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: adblocker
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adblocker
          name: "AdBlock List"
          body: |
            ## DNS Blocklist Update
            - 📅 Updated: $(date '+%Y-%m-%d %H:%M:%S UTC')
            - 📦 Auto-generated from 22 blocklists
            - 🚫 Blocks tracking, ads, and malicious domains
          files: blocklist.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
